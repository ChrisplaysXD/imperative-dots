# Font
font_family      Monocraft
font_size 12.0

# Cursor
cursor_shape block
cursor_trail 1

# Padding
window_margin_width 21.75

# No close confirmation
confirm_os_window_close 0

# Use Zsh shell
shell zsh

# Copy & Paste
map ctrl+c    copy_and_clear_or_interrupt
map ctrl+v    paste_from_clipboard

# Search
map ctrl+shift+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down
map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Transparency
background_opacity 0.7
dynamic_background_opacity yes

# Text thickness hack
text_composition_strategy 1.7 30

# --- Cyberpunk Neon Theme ---
foreground              #00ff7f
background              #000000
selection_foreground    #000000
selection_background    #ff00ff

# Cursor
cursor                  #ff00ff
cursor_text_color       #000000

# URL
url_color               #00ffff

# Borders
active_border_color     #ff00ff
inactive_border_color   #333333
bell_border_color       #ffff00

# Tab Bar
active_tab_foreground   #000000
active_tab_background   #00ff00
inactive_tab_foreground #00ff00
inactive_tab_background #222222
tab_bar_background      #000000

# Colors
# Black
color0 #121212
color8 #272727

# Red (Neon Pink/Red)
color1 #ff0055
color9 #ff0055

# Green (Vibrant Emerald)
color2  #00ff7f
color10 #00ff7f

# Yellow (Neon Orange)
